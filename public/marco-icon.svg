<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" aria-label="Marco">
  <!-- Tomato background, rounded square (iOS app icon corner radius) -->
  <rect width="512" height="512" rx="115" ry="115" fill="#E5462E"/>

  <!-- Handwritten "M" — stylized brush-script glyph in cream, tilted -5°.
       Drawn as a stroked path so the icon renders identically without
       requiring the Caveat font. Variable feel comes from rounded caps
       and joins; the slight -5° tilt is the Marco signature angle. -->
  <g transform="translate(106 192) rotate(-5)">
    <path
      d="M 0 200
         C 8 70, 28 24, 50 18
         C 78 14, 102 64, 130 168
         C 132 178, 138 180, 145 174
         L 170 132
         C 192 50, 222 12, 250 18
         C 272 24, 292 70, 300 200"
      fill="none"
      stroke="#F5EEE2"
      stroke-width="40"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- The punctum — Marco's signature ink dot. On the tomato app-icon
       variant it's ink (per the design system spec). -->
  <circle cx="425" cy="380" r="22" fill="#1C1A17"/>
</svg>
