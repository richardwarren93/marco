# Codemagic CI — cloud builds for the Marco mobile shells.
#
# Two workflows:
#   - android-build  → produces a signed .aab for Google Play (or .apk for
#                       direct sideload on BlueStacks/devices). Works today.
#   - ios-build      → produces a signed .ipa and ships it to TestFlight.
#                       Requires Apple Developer Program membership; the
#                       Codemagic side-config (App Store Connect API key,
#                       provisioning profile) must be uploaded to Codemagic
#                       before this workflow can succeed.
#
# Trigger model: by default neither workflow auto-runs on push. Both are
# `manual` so you click "Run workflow" in Codemagic when you want a build.
# Switch `triggering.events` to `[push]` and set `branch_patterns` once you
# want every merge to main to ship a build.

workflows:
  android-build:
    name: Android — signed AAB + APK
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      node: 22
      java: 21
      vars:
        # Bump this on each release — Google Play won't accept a duplicate
        # versionCode. Codemagic also exposes BUILD_NUMBER which we can
        # auto-increment; using the env var here so it's explicit.
        PACKAGE_NAME: app.marco.mobile
      groups:
        # Defined in Codemagic → Teams → Marco → Variables and secrets:
        #   ANDROID_KEYSTORE          — uploaded keystore reference (Codemagic UI)
        #   CM_KEYSTORE_PASSWORD      — keystore password
        #   CM_KEY_ALIAS              — key alias inside the keystore
        #   CM_KEY_ALIAS_PASSWORD     — alias password
        #   GCLOUD_SERVICE_ACCOUNT_CREDENTIALS — JSON for Play submission (optional)
        - marco_android_signing
    triggering:
      events: []  # manual; switch to [push] + branch_patterns when ready
    scripts:
      - name: Install Node deps
        script: |
          npm ci
      - name: Sync Capacitor → Android
        script: |
          npx cap sync android
      - name: Set up Android signing
        script: |
          # Codemagic injects the keystore via env; write it into a local
          # keystore.properties file the Gradle build references.
          cat > "$CM_BUILD_DIR/android/keystore.properties" <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_ALIAS_PASSWORD
          EOF
      - name: Build signed AAB (Play Store)
        script: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$CM_KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password=$CM_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$CM_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$CM_KEY_ALIAS_PASSWORD
      - name: Build signed APK (sideload / BlueStacks)
        script: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$CM_KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password=$CM_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$CM_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$CM_KEY_ALIAS_PASSWORD
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
    # No `publishing` block: Codemagic emails the account owner on
    # success/failure by default. Once a Google Play service account is
    # uploaded to Codemagic, add a `publishing:` block here with a
    # `google_play:` entry pointing at $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS.

  ios-build:
    name: iOS — signed IPA + TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Set this up in Codemagic → Teams → Marco → Integrations once the
      # Apple Developer Program membership is approved. The integration
      # holds the App Store Connect API key + automatic code signing.
      app_store_connect: marco_app_store_connect
    environment:
      node: 22
      xcode: latest
      # No `cocoapods` line: Capacitor 6+ uses Swift Package Manager
      # (see `ios/App/CapApp-SPM/`). There is no Podfile to install.
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: com.ACGC.crave
    triggering:
      events: []  # manual until we want every merge to ship a build
    scripts:
      - name: Install Node deps
        script: |
          npm ci
      - name: Sync Capacitor → iOS
        script: |
          npx cap sync ios
          # The repo is developed on Windows, where `cap sync` writes SPM
          # dependency paths with backslashes (..\..\..\node_modules\...). SPM on
          # macOS can't resolve those, so xcodebuild fails at -showBuildSettings.
          # Normalize any backslashes in the generated manifest to forward slashes.
          sed -i '' 's|\\|/|g' ios/App/CapApp-SPM/Package.swift || true
          echo "--- CapApp-SPM/Package.swift dependency paths after normalize ---"
          grep 'node_modules' ios/App/CapApp-SPM/Package.swift || true
      - name: Set up code signing (idempotent — reuses one Distribution cert)
        script: |
          # Distribution certificates are capped by Apple (only a couple per
          # account), so we must NOT mint a new one on every build — that's what
          # caused cert "stacking" and the eventual "maximum number of
          # certificates" failure.
          #
          # fetch-signing-files matches an existing certificate by the PUBLIC key
          # derived from the private key we pass in. So as long as we feed it the
          # SAME private key on every run, it REUSES the same Apple certificate
          # instead of creating another one.
          #
          # ── One-time setup ───────────────────────────────────────────────
          # On the first build (no CERTIFICATE_PRIVATE_KEY set) a fresh key is
          # generated AND PRINTED below. Copy it into a SECURE Codemagic env var
          # named CERTIFICATE_PRIVATE_KEY (Teams → Marco → Variables and secrets,
          # "Secure" checked). Every later build then reuses it and never creates
          # another certificate.
          keychain initialize
          if [ -n "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "Reusing stored CERTIFICATE_PRIVATE_KEY — no new certificate will be created."
            printf '%s' "$CERTIFICATE_PRIVATE_KEY" > /tmp/codemagic_key
          else
            echo "No CERTIFICATE_PRIVATE_KEY set — generating a one-time signing key."
            ssh-keygen -t rsa -b 2048 -m PEM -f /tmp/codemagic_key -q -N ""
            echo "=================================================================="
            echo " SAVE THIS PRIVATE KEY as a SECURE Codemagic env var named"
            echo " CERTIFICATE_PRIVATE_KEY so future builds reuse this certificate"
            echo " and stop creating new ones on every run:"
            echo "------------------------------------------------------------------"
            cat /tmp/codemagic_key
            echo "=================================================================="
          fi
          # --create only mints a cert/profile when none matching this key exists;
          # with a persisted key it simply fetches the existing one.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/codemagic_key \
            --create
          keychain add-certificates
          xcode-project use-profiles
          echo "=================== provisioning profiles: capability check ==================="
          for p in "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision; do
            [ -e "$p" ] || continue
            security cms -D -i "$p" 2>/dev/null > /tmp/pp.plist
            NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/pp.plist 2>/dev/null)
            APPID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /tmp/pp.plist 2>/dev/null)
            APS=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' /tmp/pp.plist 2>/dev/null)
            echo "profile: $NAME | app-id: $APPID | aps-environment: ${APS:-<<MISSING>>}"
          done
          echo "=================== end capability check ==================="
      - name: Increment build number
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: Diagnose Xcode / SPM (verbose — surfaces the real error)
        script: |
          # `xcode-project build-ipa` hides the underlying xcodebuild error and
          # only prints "Failed to show build settings". Run the same commands
          # directly here so the ACTUAL error appears in the Codemagic log.
          set +e
          echo "=================== xcodebuild -version ==================="
          xcodebuild -version
          echo "=================== Package.swift (post cap sync + normalize) ==================="
          cat ios/App/CapApp-SPM/Package.swift
          echo "=================== node_modules/@capacitor present? ==================="
          ls -la node_modules/@capacitor/ 2>&1 | head -30
          echo "=================== shared schemes present? ==================="
          ls -la ios/App/App.xcodeproj/xcshareddata/xcschemes/ 2>&1
          echo "=================== xcodebuild -list ==================="
          xcodebuild -project ios/App/App.xcodeproj -list 2>&1
          echo "=================== resolvePackageDependencies ==================="
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App 2>&1
          echo "=================== showBuildSettings (direct, real error) ==================="
          xcodebuild -project ios/App/App.xcodeproj -scheme App -showBuildSettings 2>&1 | head -80
          echo "=================== end diagnostics ==================="
          exit 0
      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      # Codemagic emails the account owner on success/failure by default.
      app_store_connect:
        # Auto-submit to TestFlight on every build. Manual App Store
        # submission still happens through App Store Connect.
        auth: integration
        submit_to_testflight: true
        # Once you have an internal TestFlight group named e.g. "Friends",
        # uncomment to auto-distribute:
        # beta_groups:
        #   - Friends
